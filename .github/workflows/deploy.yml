name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /var/www/apprenti-revision

            # Pull dernière version
            git pull origin main

            # Installer les dépendances
            npm ci --production=false

            # Générer le client Prisma
            npm run db:generate

            # Appliquer le schéma Prisma (non-interactif)
            npx prisma db push --accept-data-loss

            # Build
            rm -rf .next
            NODE_OPTIONS='--max-old-space-size=3072' NEXT_TELEMETRY_DISABLED=1 npm run build

            # Copier les fichiers statiques pour le mode standalone
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/ 2>/dev/null || true

            # Vérifier que server.js existe avant de recharger
            test -f .next/standalone/server.js || (echo "Build incomplet, server.js manquant" && exit 1)

            # Redémarrer l'app Next.js
            pm2 reload apprenti-revision || pm2 start node --name "apprenti-revision" -- .next/standalone/server.js

            # Redémarrer le worker BullMQ
            pm2 reload course-worker || pm2 start npm --name "course-worker" -- run worker:start
